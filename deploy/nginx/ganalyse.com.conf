server {
    listen 80;
    listen [::]:80;

    server_name ganalyse.com www.ganalyse.com;

    # Path where GitHub Actions deploys the Vite build output (dist/)
    root /var/www/ganalyse.com/html;
    index index.html;

    # Vite/React SPA: route all unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashed assets (filename contains hash → safe to cache forever)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static files from public/ (no hash in name → short cache with revalidation)
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Basic gzip (safe defaults)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
}


